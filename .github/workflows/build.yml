name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build executable and verify startup
        run: python tools/build.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SpeedTest-windows-x64
          path: |
            dist/SpeedTest.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Windows executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SpeedTest-windows-x64
          path: dist
      - name: Publish executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/SpeedTest.exe dist/SHA256SUMS.txt --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest --notes-file docs/release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/SpeedTest.exe dist/SHA256SUMS.txt \
              --repo "$GH_REPO" --verify-tag --title "SpeedTest $RELEASE_TAG" \
              --notes-file docs/release-notes.md --latest
          fi
